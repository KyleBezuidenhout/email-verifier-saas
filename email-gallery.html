<style>
:root {
  --bg: #050505;
  --surface: #0e0e0e;
  --border: #1a1a1a;
  --text: #e0e0e0;
  --muted: #666;
  --accent: #0099FF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

.page-header {
  padding: 60px 40px 40px;
  max-width: 1400px;
  margin: 0 auto;
}

.page-header h1 {
  font-family: 'Instrument Serif', serif;
  font-size: 48px;
  font-weight: 400;
  color: #fff;
  letter-spacing: -1px;
  margin-bottom: 8px;
}

.page-header .subtitle {
  color: var(--muted);
  font-size: 16px;
  font-weight: 300;
}

.page-header .count {
  display: inline-block;
  margin-top: 16px;
  padding: 4px 14px;
  background: #0099FF15;
  color: var(--accent);
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid #0099FF30;
}

.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(5,5,5,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 40px;
}

.nav-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav-inner::-webkit-scrollbar { display: none; }

.nav-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 14px 16px;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.nav-btn:hover { color: var(--text); }
.nav-btn.active { color: #fff; border-bottom-color: var(--accent); }

.nav-btn .badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 10px;
  margin-left: 5px;
  font-weight: 700;
  vertical-align: middle;
}
.badge-client { background: #0099FF25; color: var(--accent); }
.badge-admin { background: #f59e0b20; color: #f59e0b; }

.sections {
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px;
}

.email-section {
  display: none;
  animation: fadeIn 0.3s ease;
}
.email-section.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-header {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 32px;
}

.section-number {
  font-family: 'Instrument Serif', serif;
  font-size: 56px;
  color: #1a1a1a;
  line-height: 1;
  min-width: 70px;
}

.section-meta h2 {
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 6px;
}

.section-meta .trigger {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 4px;
}
.section-meta .trigger strong { color: #999; }

.meta-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.pill {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 4px;
  font-weight: 500;
}
.pill-source { background: #1a1a2e; color: #8b8bff; }
.pill-to { background: #2e1a1a; color: #ff8b8b; }
.pill-subject { background: #1a2e1a; color: #8bff8b; }

.email-frame {
  background: #ffffff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 20px 60px rgba(0,0,0,0.5);
  max-width: 660px;
}

.email-chrome {
  background: #f3f3f3;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid #e0e0e0;
}
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-r { background: #ff5f57; }
.dot-y { background: #febc2e; }
.dot-g { background: #28c840; }
.email-chrome .subject-line {
  margin-left: 12px;
  font-size: 12px;
  color: #666;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
}

.email-body { padding: 24px; }
.email-body a { pointer-events: none; }
</style>
